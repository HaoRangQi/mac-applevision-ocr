[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-vision-ocr"
version = "1.0.0"
description = "Local OCR for macOS built on the Vision framework: scanned PDFs and images to readable text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "apple-vision-ocr contributors" }]
keywords = ["ocr", "macos", "vision", "pdf", "text-recognition", "chinese"]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
    "Topic :: Text Processing",
]

[project.scripts]
vision-ocr = "vision_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/apple-vision-ocr"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
