name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Build engine
        run: ./scripts/build-engine.sh

      - name: Smoke test engine
        run: |
          ./bin/ocrvision --input tests/fixtures/sample.png --scale 4.5 > /dev/null
          echo "engine ok"

      - name: Build app
        run: cd app && ./build.sh
